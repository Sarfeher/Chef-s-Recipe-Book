name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Start app stack (mongo + backend + frontend)
        run: docker compose up -d --build

      - name: Wait for backend to be reachable
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:4000/api/recipes > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend did not become reachable in time"
          docker compose logs backend
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend to be reachable
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend did not become reachable in time"
          docker compose logs frontend
          exit 1

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v
