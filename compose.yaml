services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/recipes"
      PORT: "4000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_HOST: "backend"
    depends_on:
      - backend

volumes:
  mongo-data:
