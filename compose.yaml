services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/recipes"
      PORT: "4000"
    volumes:
      - ./backend/src:/app/src
      - uploads-data:/app/uploads
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_HOST: "backend"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data:
